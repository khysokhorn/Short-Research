[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "short-research"
version = "0.2.0"
description = "Research-to-script pipeline for high-retention YouTube Shorts with critique, reference analysis and ArcReel export."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ddgs>=9.0.0",
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.1",
  "trafilatura>=2.0.0",
  "typer>=0.15.0",
  "yt-dlp>=2025.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.9.0"]

[project.scripts]
short-research = "short_research.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/short_research"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
