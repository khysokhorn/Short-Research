name: reference-smoke

on:
  push:
    branches: ["feat/research-to-arcreel-mvp"]
    paths:
      - ".github/workflows/reference-smoke.yml"

jobs:
  analyzer-facebook-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Install project
        run: pip install -e .
      - name: Run actual ReferenceVideoAnalyzer on Facebook Reel
        env:
          REFERENCE_URL: "https://www.facebook.com/share/r/1GgwfBeYvX/"
        run: |
          python - <<'PY'
          import os
          from short_research.models import ReferenceVideoAnalysis
          from short_research.video_analysis import ReferenceVideoAnalyzer

          class SmokeLLM:
              def complete_json(self, *, system, user, schema, images=None, **kwargs):
                  print(f"SMOKE_FRAME_COUNT={len(images or [])}")
                  print(f"SMOKE_PROMPT_HAS_REFERENCE={os.environ['REFERENCE_URL'] in user}")
                  return ReferenceVideoAnalysis(
                      source="smoke",
                      hook_summary="smoke",
                      structure=["smoke"],
                      pacing_notes=["smoke"],
                      visual_patterns=["smoke"],
                      retention_devices=["smoke"],
                      reusable_patterns=["smoke"],
                      avoid_copying=["smoke"],
                  )

          result = ReferenceVideoAnalyzer(SmokeLLM()).analyze(
              os.environ["REFERENCE_URL"],
              visual=True,
              frame_count=8,
          )
          print("SMOKE_SOURCE=" + result.source)
          print("SMOKE_TITLE=" + result.title[:250].replace("\n", " "))
          print("SMOKE_DURATION=" + str(result.duration_seconds))
          print("SMOKE_OK=true")
          PY
